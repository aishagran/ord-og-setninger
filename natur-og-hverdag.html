<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dagens språkøkt – Edels Verden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--cream:#F6F1E6;--paper:#FFFEFA;--navy:#1C2C42;--navy-2:#29455F;--ink:#1B2438;--muted:#746F66;--coral:#BE6E56;--coral-soft:#F3DFD6;--rule:#E4DCCB;--green:#E4F0DF;--shadow:0 12px 34px rgba(28,44,66,0.08)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:radial-gradient(circle at 10% 0%,#FFF9EE 0,transparent 24rem),var(--cream);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}
.serif{font-family:'Fraunces',serif}
main{max-width:680px;margin:auto;padding:1.4rem 1.2rem 6rem}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.top strong{font-family:'Fraunces',serif;font-weight:600;font-size:1.2rem}
.small{font-size:0.82rem;color:var(--muted);margin-top:0.15rem}
.pill{background:var(--paper);border:1px solid var(--rule);border-radius:999px;padding:0.5rem 0.9rem;font-weight:700;font-size:0.85rem;flex-shrink:0;white-space:nowrap}
.progress{height:8px;background:var(--rule);border-radius:9px;overflow:hidden;margin-top:0.9rem}
.bar{height:100%;background:var(--coral);width:6%;transition:width 0.25s ease}
.card{background:var(--paper);border:1px solid rgba(28,44,66,0.08);border-radius:22px;padding:1.4rem;margin-top:1rem;box-shadow:0 7px 24px rgba(28,44,66,0.045)}
.step{font-weight:700;font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--coral)}
.hero{width:100%;max-height:420px;object-fit:contain;border-radius:16px;margin:0.9rem 0;display:block;background:var(--cream)}
.story{background:var(--cream);border:1px dashed var(--rule);border-radius:14px;padding:0.85rem 1rem;font-size:0.9rem;color:var(--ink);line-height:1.55;margin-top:0.6rem;white-space:pre-line}
.laer{background:var(--green);border:1px solid #CFE4CA;border-radius:14px;padding:0.9rem 1rem;font-size:0.92rem;color:#2F5137;line-height:1.6;margin-top:0.6rem;white-space:pre-line}
.q{font-family:'Fraunces',serif;font-size:1.22rem;font-weight:500;line-height:1.34;margin-top:0.9rem;white-space:pre-line}
.mic{font-size:0.82rem;color:var(--muted);margin-top:0.4rem}
textarea,input[type=text]{width:100%;font:inherit;font-family:'Inter',sans-serif;border:2px solid var(--rule);border-radius:14px;padding:0.85rem;background:var(--paper);min-height:52px;margin-top:0.9rem;color:var(--ink)}
textarea{min-height:90px}
textarea:focus,input:focus{outline:2px solid var(--coral);outline-offset:1px;border-color:var(--coral)}
.oral{display:flex;align-items:center;gap:0.5rem;margin-top:0.7rem;font-size:0.85rem;color:var(--muted)}
.oral input{width:auto;margin:0}
.btns{display:flex;gap:0.6rem;flex-wrap:wrap;margin-top:0.9rem}
button{border:0;border-radius:999px;padding:0.7rem 1.1rem;font:inherit;font-weight:700;font-size:0.88rem;background:var(--navy);color:#EDE6D6;cursor:pointer}
button.secondary{background:var(--coral-soft);color:#7A4530}
button.ghost{background:transparent;color:var(--muted);border:1px solid var(--rule)}
button:disabled{opacity:0.45;cursor:default}
.hidden{display:none}
.voksen{background:#F1F4F8;border:1px solid #D5DEE8;border-radius:12px;padding:0.6rem 0.85rem;font-size:0.78rem;color:#4A5A6E;line-height:1.5;margin-top:0.7rem}
.voksen summary{cursor:pointer;font-size:0.62rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#5E6F84}
.voksen[open] summary{margin-bottom:0.3rem}
.vpanel{background:var(--paper);border:1px solid var(--rule);border-radius:16px;padding:1rem;margin-top:1rem}
.vpanel h3{font-family:'Fraunces',serif;font-size:1.05rem;font-weight:600;margin-bottom:0.5rem}
.vpanel label{display:flex;align-items:flex-start;gap:0.55rem;font-size:0.88rem;line-height:1.4;margin-top:0.45rem}
.vpanel label input{margin-top:0.2rem}
.recap{background:var(--cream);border:1px dashed var(--rule);border-radius:14px;padding:0.8rem 1rem;font-size:0.88rem;color:var(--muted);line-height:1.5;margin-top:0.6rem}
.hint{background:#FBF3EC;border:1px solid var(--coral-soft);border-radius:14px;padding:0.8rem 1rem;font-size:0.9rem;color:#7A4530;line-height:1.5;margin-top:0.9rem}
.ok{background:var(--green);color:#3E6C4A;padding:0.8rem 1rem;border-radius:14px;margin-top:0.9rem;font-weight:600}
.send-bar{position:fixed;left:0;right:0;bottom:0;padding:0.8rem 1rem calc(0.8rem + env(safe-area-inset-bottom));background:rgba(28,44,66,0.96);backdrop-filter:blur(10px);display:flex;justify-content:center;z-index:50}
.send-bar button{background:var(--coral);color:#fff;width:100%;max-width:420px}
.send-note{font-size:0.72rem;color:#C7D3DE;text-align:center;margin-top:0.4rem;max-width:420px}
@media(max-width:600px){main{padding:1rem 0.9rem 6.5rem}.card{padding:1.05rem}.q{font-size:1.1rem}}
</style></head>
<body><main>
<div class="top"><div><strong>🌿 Dagens språkøkt 13.10.2026</strong><div class="small">Natur, hverdagsliv og språk · 15–20 min</div></div><div class="pill" id="count">Steg 1</div></div>
<div class="progress"><div class="bar" id="bar"></div></div>

<div class="small" id="modeBar" style="margin:0.6rem 0;display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap">Utvalg: <button class="secondary" id="mAnb" onclick="setMode('anbefalt')">Anbefalt (8)</button><button class="secondary" id="mAlle" onclick="setMode('alle')">Hele banken (15)</button></div>
<div id="stepHost"></div>

</main>

<div class="send-bar hidden" id="sendBar">
  <div>
    <button id="sendBarBtn" onclick="sendPartial()">📤 Send det som er gjort til mamma</button>
    <div class="send-note">Sender det hun har svart så langt, uansett om hun er ferdig eller ikke.</div>
  </div>
</div>

<script src="edels-data.js"></script>
<script>
if(typeof EdelsData==='undefined'){
  console.warn('edels-data.js ble ikke funnet – kjører uten lagring.');
  window.EdelsData={
    createSession:()=>'offline-'+Date.now(),
    getSession:()=>null,
    startTrial:()=>'t-'+Date.now()+'-'+Math.random(),
    responseStarted:()=>{},
    saveFirstResponse:()=>{},
    addSupport:()=>{},
    setSupportResponse:()=>{},
    saveGeneralization:()=>{},
    finishAndSubmit:()=>{},
    completeSession:()=>{}
  };
}
const SESSION_KEY='edels_natur_hverdag_2026_10_13_v1_session';
let sessionId=localStorage.getItem(SESSION_KEY);
try{
  if(!sessionId || !EdelsData.getSession(sessionId) || EdelsData.getSession(sessionId).status==='completed'){
    sessionId=EdelsData.createSession({title:'Dagens språkøkt 13.10.2026',researchGoal:'transfer_nature_to_everyday_causal_language',schoolSubject:'naturfag'});
    localStorage.setItem(SESSION_KEY,sessionId);
  }
}catch(e){
  console.warn('Kunne ikke starte lagret økt, starter en midlertidig en.',e);
  sessionId=EdelsData.createSession({title:'Dagens språkøkt 13.10.2026',researchGoal:'transfer_nature_to_everyday_causal_language',schoolSubject:'naturfag'});
}

// ---------- Plan ----------
// Bank med 15 oppgaver (Natur + hverdagsliv + fortell). Anbefalt økt: 1, 2, 5, 7, 9, 11, 13, 14.
// Første svar lagres alltid før hjelp. Én gradert pekepinn om gangen. Ingen retting av grammatikk.
const H=(level,text,explicit)=>({level,text,explicit:!!explicit});
function item(n,del,title,o){
  const base={kind:'support_probe',num:n,story:o.story,taskType:o.type||'inferential_probe'};
  const out=[Object.assign({},base,{id:'q'+n,title:'Del '+del+' · '+n+'. '+title,target:o.target,researchGoal:o.goal,question:o.q,hints:o.h,adultNote:o.note})];
  if(o.fq) out.push(Object.assign({},base,{id:'q'+n+'b',title:'Del '+del+' · '+n+'. '+title+' – oppfølging',target:o.target+'_oppfolging',researchGoal:o.goal+'_followup',question:o.fq,hints:o.fh,adultNote:o.fnote}));
  return out;
}
const ALL=[].concat(
 item(1,1,'Dyrene i skogen',{target:'konsekvens_skog_dyr',goal:'transfer_habitat_loss',q:'Hva kan skje med dyrene hvis skogen de bor i, blir borte?',h:[H(2,'Tenk på hvor dyrene bor og hvor de finner mat.'),H(6,'Hvis skogen blir borte, kan dyrene …')],fq:'Hvorfor kan det skje?',fh:[H(2,'Tenk på hva dyrene trenger fra skogen.'),H(6,'Det kan skje fordi …')]}),
 item(2,1,'Finn ordet',{target:'bevare',goal:'retention_bevare_retrieval',type:'vocabulary_retrieval_probe',q:'Hva kaller vi det når vi passer på naturen slik at den ikke blir ødelagt?',h:[H(2,'Tenk på å passe godt på noe slik at det ikke blir ødelagt.'),H(6,'Ordet begynner med «be-» …'),H(7,'Ordet er: bevare.',1)],note:'Ikke si ordet før første svar. Hvis hun ikke finner det, bruk pekepinnene én om gangen før oppfølgingsspørsmålet.',fq:'Kan du bruke ordet i en setning?',fh:[H(6,'Begynn slik: Vi må … naturen fordi …')],fnote:'Registrer om ordet ble brukt riktig i setningen, ikke bare gjentatt.'}),
 item(3,1,'Bier og blomster',{target:'bie_blomst_relasjon',goal:'retention_species_relation',q:'Hvorfor er bier viktige for blomster og planter?',h:[H(2,'Tenk på hva bien gjør når den besøker blomstene.'),H(3,'Tenk på pollen.')],fq:'Hva kan skje hvis det blir veldig få bier?',fh:[H(2,'Hva trenger blomstene bien til?'),H(6,'Hvis det blir få bier, kan blomstene …')]}),
 item(4,1,'Plast i elva',{target:'arsaksetning_plast_elv',goal:'causal_sentence_with_fordi',type:'sentence_formulation',q:'Hvorfor bør vi ikke kaste plast i elva? Bruk ordet «fordi» i svaret ditt.',h:[H(2,'Tenk på hvem som bor i elva.'),H(6,'Vi bør ikke kaste plast i elva fordi …')],fq:'Hva kan skje med fiskene?',fh:[H(2,'Tenk på vannet fiskene lever i.')]}),
 item(5,1,'Forskeren',{target:'hypotese',goal:'retention_hypotese_new_context',type:'vocabulary_retrieval_probe',story:'En forsker tror at en plante vokser bedre i sollys enn i mørket.',q:'Hva kaller vi en slik idé som forskeren vil undersøke?',h:[H(2,'Tenk på noe forskeren tror, men ennå ikke har sjekket.'),H(5,'Er det «bevis», «konklusjon» eller «hypotese»?'),H(6,'Ordet begynner med «hypo-» …'),H(7,'Ordet er: hypotese.',1)],note:'Ikke si ordet før første svar.',fq:'Hvordan kan forskeren finne ut om ideen stemmer?',fh:[H(2,'Tenk på hva forskeren kan prøve, for eksempel med to planter.'),H(3,'Hva kan forskeren sammenligne?')]}),
 item(6,1,'Forskjellige arter',{target:'biologisk_mangfold_funksjon',goal:'transfer_biodiversity_function',story:'I en innsjø lever det fisk, frosker, insekter og mange forskjellige planter.',q:'Hvorfor er det bra at det finnes forskjellige arter?',h:[H(2,'Tenk på hvordan fisk, frosker, insekter og planter kan trenge hverandre.'),H(6,'Det er bra fordi …')],fq:'Hva kan skje hvis noen av artene forsvinner?',fh:[H(2,'Tenk på hvem som trengte den arten.')]}),
 item(7,2,'Lage middag',{target:'problemlosning_middag',goal:'everyday_problem_solving_with_justification',type:'problem_solving_probe',story:'Du skal lage middag, men oppdager at du mangler en ingrediens.',q:'Hva kan du gjøre?',h:[H(2,'Tenk på hva du har hjemme, og hva du kan gjøre for å få det du mangler.'),H(3,'Kan du bytte ut ingrediensen med noe annet, eller skaffe den?')],fq:'Hvorfor valgte du den løsningen?',fh:[H(6,'Jeg valgte det fordi …')]}),
 item(8,2,'Handle i butikken',{target:'problemlosning_butikk',goal:'everyday_problem_solving_planning',type:'problem_solving_probe',story:'Du skal kjøpe melk, brød og egg. Når du kommer hjem, oppdager du at du har glemt eggene.',q:'Hva gjør du?',h:[H(2,'Tenk på hva du trenger, og hvor du kan få tak i det.')],fq:'Hva kan du gjøre neste gang for å huske alt?',fh:[H(2,'Tenk på noe du kan ha med deg eller gjøre før du går.')]}),
 item(9,2,'Temperatur i hverdagen',{target:'informasjon_temperatur',goal:'everyday_information_seeking_with_justification',type:'problem_solving_probe',story:'Du skal gå ut, men vet ikke om du trenger en varm jakke.',q:'Hvordan kan du finne ut av det?',h:[H(2,'Tenk på hvor du kan sjekke været, eller hva du kan kjenne på.')],fq:'Hvorfor er det nyttig å vite temperaturen?',fh:[H(6,'Det er nyttig fordi …')]}),
 item(10,2,'Fritid og planlegging',{target:'planlegging_handball',goal:'everyday_planning_and_explaining',type:'problem_solving_probe',story:'Du har håndballtrening klokken fem, men en venn vil besøke deg klokken fire.',q:'Hva kan du gjøre?',h:[H(2,'Tenk på tidspunktene. Hva må du rekke først?')],fq:'Hvordan kan du forklare planen din til vennen din?',fh:[H(6,'Du kan begynne slik: Jeg har trening klokken fem, så …')]}),
 item(11,2,'Ta vare på en plante',{target:'hypotese_plante_hverdag',goal:'transfer_hypothesis_and_checking',story:'Du har en plante hjemme. Etter noen dager begynner bladene å henge.',q:'Hva tror du kan være grunnen?',h:[H(2,'Tenk på hva planter trenger for å vokse.')],fq:'Hvordan kan du undersøke om du har rett?',fh:[H(2,'Tenk på hva du kan prøve eller sjekke, og hva du kan se etterpå.')],note:'Se om hun spontant bruker «tror» eller «kanskje», og om hun foreslår en måte å sjekke på. Ikke si «hypotese».'}),
 item(12,2,'Sortere søppel',{target:'sortering_avfall',goal:'everyday_categorization_and_justification',type:'problem_solving_probe',story:'Du har en tom melkekartong, et bananskall og en plastflaske.',q:'Hva gjør du med dem?',h:[H(2,'Tenk på søppelsorteringen hjemme. Hvor kan hver ting havne?')],fq:'Hvorfor er det viktig å sortere avfallet?',fh:[H(6,'Det er viktig fordi …')]}),
 item(13,3,'Først – etterpå – til slutt',{target:'sekvens_frokost',goal:'sequence_retell_with_connectors',type:'sequence_formulation',q:'Fortell hvordan du lager deg frokost. Bruk ordene «først», «etterpå» og «til slutt».',h:[H(6,'Begynn slik: Først …')]}),
 item(14,3,'Forklar hvorfor',{target:'problemlosning_nokkel',goal:'problem_solving_with_causal_justification',type:'problem_solving_probe',story:'Du kommer hjem fra skolen og oppdager at du har glemt nøkkelen.',q:'Hva gjør du, og hvorfor?',h:[H(2,'Tenk på hvem som kan hjelpe deg, eller hvor du kan vente.'),H(6,'Jeg … fordi …')]}),
 item(15,3,'Tenk selv',{target:'mening_begrunnelse_skole',goal:'opinion_with_justification',type:'sentence_formulation',q:'Hvis du kunne forandre én ting på skolen for å gjøre hverdagen bedre, hva ville du forandret? Forklar hvorfor.',h:[H(6,'Jeg ville forandret … fordi …')]})
);
const ANBEFALT=[1,2,5,7,9,11,13,14];
let PLAN=ALL.filter(s=>ANBEFALT.includes(s.num));
let planMode='anbefalt';
function withPrefix(step,v){ return step.prefix?(step.prefix+' '+v.trim()):v; }
function prefixHtml(step){ return step.prefix?`<div class="story"><strong>${step.prefix} …</strong></div>`:''; }
function setMode(m){
  if(Object.keys(answers).length) return;
  planMode=m; planIdx=0;
  PLAN=m==='alle'?ALL.slice():ALL.filter(s=>ANBEFALT.includes(s.num));
  render();
}

let planIdx=0;
const answers={};
const trialIds={};
const startedTrials=new Set();
const hintState={}; // per support_probe step: {hintIdx, baselineSaved}
const host=document.getElementById('stepHost');
let questionShownAt=Date.now();

function ensureTrial(step){
  if(trialIds[step.id]) return trialIds[step.id];
  trialIds[step.id]=EdelsData.startTrial(sessionId,{
    target:step.target,researchGoal:step.researchGoal,taskType:step.taskType,modality:'written',
    condition:'natur_hverdag_2026_10_13',question:step.question,context:step.id
  });
  return trialIds[step.id];
}
function markStarted(trialId){
  if(startedTrials.has(trialId)) return;
  startedTrials.add(trialId);
  EdelsData.responseStarted(sessionId,trialId);
}
function setProgress(){
  const mb=document.getElementById('modeBar'); if(mb){mb.style.display=Object.keys(answers).length?'none':'flex';}
  const ma=document.getElementById('mAnb'),ml=document.getElementById('mAlle'); if(ma){ma.style.fontWeight=planMode==='anbefalt'?'700':'400';ml.style.fontWeight=planMode==='alle'?'700':'400';}
  document.getElementById('count').textContent='Steg '+(planIdx+1)+' av '+PLAN.length;
  document.getElementById('bar').style.width=Math.round(((planIdx+1)/PLAN.length)*100)+'%';
}
function speak(t){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/\n/g,' '));u.lang='nb-NO';speechSynthesis.speak(u)}
function escAttr(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function updateSendBar(){
  const bar=document.getElementById('sendBar');
  if(!bar) return;
  bar.classList.toggle('hidden', Object.keys(answers).length===0);
}
function summaryText(){
  return PLAN.filter(s=>answers[s.id]||skipped[s.id]).map(s=>{
    if(skipped[s.id]) return `${s.title}\n→ ${s.skipNote||'undervisning hoppet over (hun forklarte det selv)'}`;
    const base=answers[s.id+'__baseline'];
    if(base){
      const hs=hintState[s.id];
      let t=`${s.title}\n${s.question||''}\n→ Første svar: ${base.text}`;
      if(hs&&hs.hintIdx>=0){
        const h=s.hints[hs.hintIdx];
        t+=`\n→ Pekepinn (nivå ${h.level||hs.hintIdx+1}): ${h.text}`;
        if(answers[s.id]&&answers[s.id].text!==base.text) t+=`\n→ Etter pekepinn: ${answers[s.id].text}`;
        if(answers[s.id+'__retest']) t+=`\n→ Uten pekepinn (nytt forsøk): ${answers[s.id+'__retest'].text}`;
      }
      return t;
    }
    return `${s.title}\n${s.question||''}\n→ ${answers[s.id].text}`;
  }).join('\n\n');
}
async function sendPartial(){
  const btn=document.getElementById('sendBarBtn');
  const original=btn.textContent;
  btn.disabled=true; btn.textContent='Sender …';
  try{
    const r=await fetch('https://formspree.io/f/mqeolldg',{
      method:'POST',
      headers:{'Content-Type':'application/json','Accept':'application/json'},
      body:JSON.stringify({
        _subject:'Dagens språkøkt 13.10.2026 – fremgang underveis',
        oppgave:'Dagens språkøkt 13.10.2026',
        session_id:sessionId,
        Tekst_hun_skrev:summaryText(),
        antall_besvart:PLAN.filter(s=>answers[s.id]).length+' av '+PLAN.filter(s=>s.kind!=='display').length,
        dato:new Date().toLocaleString('no-NO')
      }),
      keepalive:true
    });
    if(!r.ok) throw new Error('HTTP '+r.status);
    btn.textContent='✓ Sendt!';
    setTimeout(()=>{btn.textContent=original;btn.disabled=false;},1800);
  }catch(e){
    btn.textContent='Kunne ikke sende – prøv igjen';
    btn.disabled=false;
  }
}
// Samme pålitelige, direkte metode som sendPartial() – ikke via EdelsData sin kø.
async function sendFinal(){
  const statusEl=document.getElementById('sendStatus');
  if(statusEl) statusEl.textContent='Sender til mamma …';
  try{
    const r=await fetch('https://formspree.io/f/mqeolldg',{
      method:'POST',
      headers:{'Content-Type':'application/json','Accept':'application/json'},
      body:JSON.stringify({
        _subject:'Dagens språkøkt 13.10.2026 – fullført økt',
        oppgave:'Dagens språkøkt 13.10.2026',
        session_id:sessionId,
        Tekst_hun_skrev:summaryText(),
        antall_besvart:PLAN.filter(s=>answers[s.id]).length+' av '+PLAN.filter(s=>s.kind!=='display').length,
        status:'fullført',
        dato:new Date().toLocaleString('no-NO')
      }),
      keepalive:true
    });
    if(!r.ok) throw new Error('HTTP '+r.status);
    if(statusEl) statusEl.textContent='✓ Sendt til mamma';
  }catch(e){
    if(statusEl){
      statusEl.textContent='Kunne ikke sende – trykk her for å prøve igjen';
      statusEl.style.cursor='pointer';
      statusEl.onclick=()=>sendFinal();
    }
  }
}

function render(){
  setProgress();
  const step=PLAN[planIdx];
  if(!step){ host.innerHTML=''; return; }
  questionShownAt=Date.now();
  if(step.kind==='display') renderDisplay(step);
  else if(step.kind==='support_probe') renderSupportProbe(step);
  else renderProbe(step);
}

// ---------- Display (undervisning, ingen registrering) ----------
function renderDisplay(step){
  host.innerHTML=`
    <section class="card">
      <div class="step">${step.title}</div>
      ${step.img?`<img class="hero" src="${step.img}" alt="Illustrasjon">`:''}
      <div class="laer">${step.story}</div>
      <div class="btns">
        <button onclick="advanceDisplay()">Neste</button>
        <button class="secondary" onclick="speak(${escAttr(JSON.stringify(step.story))})">🔊 Les opp</button>
        ${step.skippable?`<button class="ghost" onclick="skipDisplay()">${step.skipLabel||'Hun forklarte det selv – hopp over'}</button>`:''}
      </div>
    </section>`;
}
function advanceDisplay(){ planIdx++; render(); }
// Støtte som ble hoppet over registreres i oppsummeringen (viktig for voksenpanelet).
const skipped={};
function skipDisplay(){ skipped[PLAN[planIdx].id]=true; planIdx++; render(); }

// ---------- Vanlig probe (åpent spørsmål) ----------
function renderProbe(step){
  const recap=(step.recapFrom&&answers[step.recapFrom]&&!step.noRecapText)?
    `<div class="recap"><strong>Hun sa nettopp:</strong> ${answers[step.recapFrom].text}</div>`:'';
  const story=step.story?`<div class="story">${step.story}</div>`:'';
  const isLast=planIdx===PLAN.length-1;
  host.innerHTML=`
    <section class="card">
      <div class="step">${step.title}</div>
      ${step.img?`<img class="hero" src="${step.img}" alt="Illustrasjon">`:''}
      ${story}
      ${recap}
      <p class="q">${step.question}</p>
      ${step.adultNote?`<details class="voksen"><summary>Til voksen</summary>${step.adultNote}</details>`:''}
      <div class="mic">🎤 Hun kan svare muntlig også – skriv det hun sier.</div>
      <textarea id="probeInput" placeholder="Skriv svaret her …"></textarea>
      <label class="oral"><input type="checkbox" id="probeOral"> Hun sa det høyt før hun skrev</label>
      <div class="btns">
        <button onclick="saveProbe()">${isLast?'Fullfør økten':'Lagre svaret'}</button>
        ${step.story?`<button class="secondary" onclick="speak(${escAttr(JSON.stringify(step.story+' '+step.question))})">🔊 Les opp</button>`:''}
      </div>
      <div id="doneBox" class="hidden">
        <div class="ok">🌟 Ferdig! Bra jobbet i dag.</div>
        <div id="sendStatus" class="small" style="margin-top:0.5rem;color:var(--muted)"></div>
        ${isLast?ADULT_PANEL_HTML:''}
      </div>
    </section>`;
  const tid=ensureTrial(step);
  document.getElementById('probeInput').addEventListener('input',()=>markStarted(tid),{once:true});
}
function saveProbe(){
  const step=PLAN[planIdx];
  const val=document.getElementById('probeInput').value;
  if(!val.trim()){alert('Skriv et svar først.');return}
  const oral=document.getElementById('probeOral').checked;
  const tid=ensureTrial(step);
  EdelsData.saveFirstResponse(sessionId,tid,val,{source:'natur_hverdag_ui',oral,latencyMs:Date.now()-questionShownAt});
  answers[step.id]={text:val,oral};
  updateSendBar();
  const isLast=planIdx===PLAN.length-1;
  if(isLast){
    EdelsData.completeSession(sessionId);
    sendFinal();
    document.getElementById('doneBox').classList.remove('hidden');
    document.querySelector('#stepHost button[onclick="saveProbe()"]').disabled=true;
    const bar=document.getElementById('sendBar');
    if(bar) bar.classList.add('hidden');
    planIdx++; setProgress();
    return;
  }
  planIdx++; render();
}

// ---------- Support probe (gradert hjelp, bare hvis nødvendig) ----------
function startRetest(){ const st=hintState[PLAN[planIdx].id]; st.retest='asking'; renderSupportProbe(PLAN[planIdx]); }
function saveRetest(){
  const step=PLAN[planIdx]; const raw=document.getElementById('retestInput').value;
  if(!raw.trim()){alert('Skriv et svar først.');return}
  const val=withPrefix(step,raw);
  EdelsData.saveSupportRemoved(sessionId,ensureTrial(step),val);
  answers[step.id+'__retest']={text:val};
  hintState[step.id].retest='done';
  updateSendBar();
  advanceSupportProbe();
}
function renderSupportProbe(step){
  const st=hintState[step.id] || (hintState[step.id]={baselineSaved:false,hintIdx:-1});
  if(st.retest==='asking'){
    host.innerHTML=`<section class="card"><div class="step">${step.title} · nytt forsøk uten pekepinn</div>
      ${step.story?`<div class="story">${step.story}</div>`:''}
      <p class="q">${step.question}</p>
      <div class="mic">Pekepinnen er fjernet. Hun forklarer på nytt med egne ord.</div>
      <textarea id="retestInput" placeholder="Skriv svaret her …"></textarea>
      <div class="btns"><button onclick="saveRetest()">Lagre svar uten pekepinn</button><button class="secondary" onclick="advanceSupportProbe()">Hopp over</button></div></section>`;
    return;
  }
  const story=step.story?`<div class="story">${step.story}</div>`:'';
  let hintBlock='';
  if(st.hintIdx>=0){
    const h=step.hints[st.hintIdx];
    hintBlock=`<div class="hint"><strong>${h.explicit?'Modell (nivå 7 – ikke en test):':'Pekepinn '+(st.hintIdx+1)+':'}</strong> ${h.text}</div>`;
    if(!h.explicit){
      hintBlock+=`<textarea id="hintInput" placeholder="Nytt svar, hvis hun vil prøve igjen …"></textarea>`;
    }
  }
  const baselineShown = st.baselineSaved ? `<div class="recap"><strong>Hun svarte først:</strong> ${answers[step.id+'__baseline']?.text||''}</div>` : '';

  let actionButtons='';
  if(!st.baselineSaved){
    actionButtons=`<div class="btns">
      <button onclick="saveSupportBaseline()">Lagre svaret</button>
      <button class="secondary" onclick="speak(${escAttr(JSON.stringify((step.story||'')+' '+step.question))})">🔊 Les opp</button>
    </div>`;
  } else if(st.hintIdx===-1){
    actionButtons=`<div class="btns">
      <button onclick="advanceSupportProbe()">Hun klarte det – gå videre</button>
      <button class="secondary" onclick="giveNextHint()">Hun trenger en pekepinn</button>
    </div>`;
  } else {
    const h=step.hints[st.hintIdx];
    if(h.explicit){
      actionButtons=`<div class="btns"><button onclick="startRetest()">Prøv igjen uten pekepinn</button><button class="secondary" onclick="advanceSupportProbe()">Gå videre</button></div>`;
    } else {
      const hasNext=st.hintIdx+1<step.hints.length;
      actionButtons=`<div class="btns">
        <button onclick="saveSupportResponse()">Lagre nytt svar</button>
        <button class="secondary" onclick="startRetest()">Prøv igjen uten pekepinn</button>
        ${hasNext?`<button class="secondary" onclick="giveNextHint()">Enda en pekepinn</button>`
                 :`<button class="secondary" onclick="advanceSupportProbe()">Gå videre</button>`}
      </div>`;
    }
  }

  host.innerHTML=`
    <section class="card">
      <div class="step">${step.title}</div>
      ${(step.img&&(!step.imgAfterBaseline||st.baselineSaved))?`<img class="hero" src="${step.img}" alt="Illustrasjon">`:''}
      ${story}
      <p class="q">${step.question}</p>
      ${step.adultNote?`<details class="voksen"><summary>Til voksen</summary>${step.adultNote}</details>`:''}
      ${!st.baselineSaved?`
        <div class="mic">🎤 Hun kan svare muntlig også – skriv det hun sier.</div>
        <textarea id="probeInput" placeholder="Skriv svaret her …"></textarea>
        <label class="oral"><input type="checkbox" id="probeOral"> Hun sa det høyt før hun skrev</label>
      `:baselineShown+hintBlock}
      ${actionButtons}
    </section>`;
  const tid=ensureTrial(step);
  const inputEl=document.getElementById('probeInput');
  if(inputEl) inputEl.addEventListener('input',()=>markStarted(tid),{once:true});
}
function saveSupportBaseline(){
  const step=PLAN[planIdx];
  const val=document.getElementById('probeInput').value;
  if(!val.trim()){alert('Skriv et svar først.');return}
  const oral=document.getElementById('probeOral').checked;
  const tid=ensureTrial(step);
  EdelsData.saveFirstResponse(sessionId,tid,val,{source:'natur_hverdag_ui',oral,latencyMs:Date.now()-questionShownAt});
  answers[step.id+'__baseline']={text:val,oral};
  answers[step.id]={text:val,oral}; // beste svar så langt, for delvis-sending
  updateSendBar();
  hintState[step.id].baselineSaved=true;
  renderSupportProbe(step);
}
function giveNextHint(){
  const step=PLAN[planIdx];
  const st=hintState[step.id];
  const nextIdx=st.hintIdx+1;
  if(nextIdx>=step.hints.length) return;
  const h=step.hints[nextIdx];
  EdelsData.addSupport(sessionId,ensureTrial(step),h.level||nextIdx+1,h.explicit?'explicit_model':'hint',h.text);
  st.hintIdx=nextIdx;
  renderSupportProbe(step);
}
function saveSupportResponse(){
  const step=PLAN[planIdx];
  const st=hintState[step.id];
  const val=document.getElementById('hintInput').value;
  if(!val.trim()){alert('Skriv et svar først.');return}
  EdelsData.setSupportResponse(sessionId,ensureTrial(step),st.hintIdx,val);
  answers[step.id]={text:val,oral:false};
  updateSendBar();
  renderSupportProbe(step);
}
function advanceSupportProbe(){
  if(planIdx===PLAN.length-1){
    EdelsData.completeSession(sessionId);
    host.innerHTML=`<section class="card"><div class="step">Ferdig</div>
      <div class="ok">🌟 Ferdig! Bra jobbet i dag.</div>
      <div id="sendStatus" class="small" style="margin-top:0.5rem;color:var(--muted)"></div>
      ${ADULT_PANEL_HTML}</section>`;
    sendFinal();
    const bar=document.getElementById('sendBar'); if(bar) bar.classList.add('hidden');
    planIdx++; setProgress();
    return;
  }
  planIdx++; render();
}

// ---------- Registro adulto (fredag) ----------
const ADULT_ITEMS=[
  'Recuperou bevare e hypotese sem pista (2, 5)',
  'Explicou causa/consequência na natureza (1, 3, 4, 6)',
  'Propôs solução plausível a problema cotidiano (7, 8, 10, 12)',
  'Justificou escolha com fordi/porque (7, 11, 12, 14)',
  'Organizou sequência com først/etterpå/til slutt (13)',
  'Formulou hipótese e modo de verificar (5, 11)'
];
const ADULT_PANEL_HTML=`
  <div class="vpanel">
    <h3>Registro adulto — dagens økt</h3>
    ${ADULT_ITEMS.map((t,i)=>`<label><input type="checkbox" class="adultChk" data-i="${i}"> ${t}</label>`).join('')}
    <textarea id="adultNotes" placeholder="Observações …"></textarea>
    <div class="btns"><button onclick="copyAdult()">Kopier svar og observasjoner</button></div>
    <div id="copyStatus" class="small" style="margin-top:0.4rem"></div>
  </div>`;
const REC={};
function ukeText(){
  return PLAN.map(st=>{
    const hs=hintState[st.id];
    const first=answers[st.id+'__baseline']?answers[st.id+'__baseline'].text:(answers[st.id]?answers[st.id].text:null);
    let pista, after;
    if(st.kind==='support_probe'){
      pista=(hs&&hs.hintIdx>=0)?('nível '+st.hints[hs.hintIdx].level+' – '+st.hints[hs.hintIdx].text):'sem pista';
      after=(hs&&hs.hintIdx>=0&&answers[st.id]&&answers[st.id].text!==first)?('etter pista: '+answers[st.id].text):'[sem retirada]';
      if(answers[st.id+'__retest']) after=(after==='[sem retirada]'?'':after+' | ')+'retirada: '+answers[st.id+'__retest'].text;
    } else { pista='sem pista'; after='—'; }
    return (REC[st.id]||st.title)+'\nPrimeira resposta: '+(first||'[não registrada]')+'\nPista mínima: '+pista+'\nApós pista/retirada: '+after;
  }).join('\n\n');
}
function buildAdultText(){
  const checks=[...document.querySelectorAll('.adultChk')].map(c=>`[${c.checked?'x':' '}] ${ADULT_ITEMS[+c.dataset.i]}`).join('\n');
  const notes=(document.getElementById('adultNotes')||{value:''}).value;
  return 'EDELS VERDEN — DAGENS SPRÅKØKT 13.10.2026\n\n'+ukeText()+'\n\nREGISTRO ADULTO\n'+checks+'\n\nObservações:\n'+notes;
}
async function copyAdult(){
  const text=buildAdultText(), st=document.getElementById('copyStatus');
  try{ await navigator.clipboard.writeText(text); st.textContent='✓ Kopiert'; }
  catch(e){
    const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); st.textContent='✓ Kopiert'; }catch(e2){ st.textContent='Kunne ikke kopiere – merk teksten selv'; }
    ta.remove();
  }
}

render();
</script></body></html>
