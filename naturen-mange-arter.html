<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Naturen trenger mange arter – Edels Verden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--cream:#F6F1E6;--paper:#FFFEFA;--navy:#1C2C42;--navy-2:#29455F;--ink:#1B2438;--muted:#746F66;--coral:#BE6E56;--coral-soft:#F3DFD6;--rule:#E4DCCB;--green:#E4F0DF;--shadow:0 12px 34px rgba(28,44,66,0.08)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:radial-gradient(circle at 10% 0%,#FFF9EE 0,transparent 24rem),var(--cream);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}
.serif{font-family:'Fraunces',serif}
main{max-width:680px;margin:auto;padding:1.4rem 1.2rem 6rem}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.top strong{font-family:'Fraunces',serif;font-weight:600;font-size:1.2rem}
.small{font-size:0.82rem;color:var(--muted);margin-top:0.15rem}
.pill{background:var(--paper);border:1px solid var(--rule);border-radius:999px;padding:0.5rem 0.9rem;font-weight:700;font-size:0.85rem;flex-shrink:0;white-space:nowrap}
.progress{height:8px;background:var(--rule);border-radius:9px;overflow:hidden;margin-top:0.9rem}
.bar{height:100%;background:var(--coral);width:6%;transition:width 0.25s ease}
.card{background:var(--paper);border:1px solid rgba(28,44,66,0.08);border-radius:22px;padding:1.4rem;margin-top:1rem;box-shadow:0 7px 24px rgba(28,44,66,0.045)}
.step{font-weight:700;font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--coral)}
.hero{width:100%;max-height:420px;object-fit:contain;border-radius:16px;margin:0.9rem 0;display:block;background:var(--cream)}
.story{background:var(--cream);border:1px dashed var(--rule);border-radius:14px;padding:0.85rem 1rem;font-size:0.9rem;color:var(--ink);line-height:1.55;margin-top:0.6rem;white-space:pre-line}
.laer{background:var(--green);border:1px solid #CFE4CA;border-radius:14px;padding:0.9rem 1rem;font-size:0.92rem;color:#2F5137;line-height:1.6;margin-top:0.6rem;white-space:pre-line}
.q{font-family:'Fraunces',serif;font-size:1.22rem;font-weight:500;line-height:1.34;margin-top:0.9rem;white-space:pre-line}
.mic{font-size:0.82rem;color:var(--muted);margin-top:0.4rem}
textarea,input[type=text]{width:100%;font:inherit;font-family:'Inter',sans-serif;border:2px solid var(--rule);border-radius:14px;padding:0.85rem;background:var(--paper);min-height:52px;margin-top:0.9rem;color:var(--ink)}
textarea{min-height:90px}
textarea:focus,input:focus{outline:2px solid var(--coral);outline-offset:1px;border-color:var(--coral)}
.oral{display:flex;align-items:center;gap:0.5rem;margin-top:0.7rem;font-size:0.85rem;color:var(--muted)}
.oral input{width:auto;margin:0}
.btns{display:flex;gap:0.6rem;flex-wrap:wrap;margin-top:0.9rem}
button{border:0;border-radius:999px;padding:0.7rem 1.1rem;font:inherit;font-weight:700;font-size:0.88rem;background:var(--navy);color:#EDE6D6;cursor:pointer}
button.secondary{background:var(--coral-soft);color:#7A4530}
button.ghost{background:transparent;color:var(--muted);border:1px solid var(--rule)}
button:disabled{opacity:0.45;cursor:default}
.hidden{display:none}
.recap{background:var(--cream);border:1px dashed var(--rule);border-radius:14px;padding:0.8rem 1rem;font-size:0.88rem;color:var(--muted);line-height:1.5;margin-top:0.6rem}
.hint{background:#FBF3EC;border:1px solid var(--coral-soft);border-radius:14px;padding:0.8rem 1rem;font-size:0.9rem;color:#7A4530;line-height:1.5;margin-top:0.9rem}
.ok{background:var(--green);color:#3E6C4A;padding:0.8rem 1rem;border-radius:14px;margin-top:0.9rem;font-weight:600}
.send-bar{position:fixed;left:0;right:0;bottom:0;padding:0.8rem 1rem calc(0.8rem + env(safe-area-inset-bottom));background:rgba(28,44,66,0.96);backdrop-filter:blur(10px);display:flex;justify-content:center;z-index:50}
.send-bar button{background:var(--coral);color:#fff;width:100%;max-width:420px}
.send-note{font-size:0.72rem;color:#C7D3DE;text-align:center;margin-top:0.4rem;max-width:420px}
@media(max-width:600px){main{padding:1rem 0.9rem 6.5rem}.card{padding:1.05rem}.q{font-size:1.1rem}}
</style></head>
<body><main>
<div class="top"><div><strong>🌿 Naturen trenger mange arter</strong><div class="small">En vanlig økt</div></div><div class="pill" id="count">Steg 1</div></div>
<div class="progress"><div class="bar" id="bar"></div></div>

<div id="stepHost"></div>

</main>

<div class="send-bar hidden" id="sendBar">
  <div>
    <button id="sendBarBtn" onclick="sendPartial()">📤 Send det som er gjort til mamma</button>
    <div class="send-note">Sender det hun har svart så langt, uansett om hun er ferdig eller ikke.</div>
  </div>
</div>

<script src="edels-data.js"></script>
<script>
if(typeof EdelsData==='undefined'){
  console.warn('edels-data.js ble ikke funnet – kjører uten lagring.');
  window.EdelsData={
    createSession:()=>'offline-'+Date.now(),
    getSession:()=>null,
    startTrial:()=>'t-'+Date.now()+'-'+Math.random(),
    responseStarted:()=>{},
    saveFirstResponse:()=>{},
    addSupport:()=>{},
    setSupportResponse:()=>{},
    saveGeneralization:()=>{},
    finishAndSubmit:()=>{},
    completeSession:()=>{}
  };
}
const SESSION_KEY='edels_naturen_mangfold_v1_session';
let sessionId=localStorage.getItem(SESSION_KEY);
try{
  if(!sessionId || !EdelsData.getSession(sessionId) || EdelsData.getSession(sessionId).status==='completed'){
    sessionId=EdelsData.createSession({title:'Naturen trenger mange arter',researchGoal:'school_concept_baseline_plus_longitudinal_recovery',schoolSubject:'naturfag'});
    localStorage.setItem(SESSION_KEY,sessionId);
  }
}catch(e){
  console.warn('Kunne ikke starte lagret økt, starter en midlertidig en.',e);
  sessionId=EdelsData.createSession({title:'Naturen trenger mange arter',researchGoal:'school_concept_baseline_plus_longitudinal_recovery',schoolSubject:'naturfag'});
}

// ---------- Hint-stige for "hvorfor er mangfold bra" ----------
// Første pekepinn er et ekte støtte-spørsmål (bie/blomst), andre er eksplisitt
// undervisning (ikke en test – ingen tekstfelt, bare "Gå videre").
const HVORFOR_HINTS=[
  {text:'Tenk på biene og blomstene. Trenger de hverandre?'},
  {text:'Arter kan være avhengige av hverandre.\nBien får mat fra blomsten. Blomsten får hjelp av bien.',explicit:true}
];

// ---------- Plan ----------
// Uke-start: ikke en lang gjennomgang av alle begrepene. Baseline først,
// undervisning bare der det trengs, og en kort oppfrisking av det
// langsgående (hypotese, hvorfor, årsak, muntlig→skriftlig).
const PLAN=[
  {id:'tela1',kind:'probe',title:'Del 1 · Overraskelse',
    target:'hypotese',researchGoal:'retention_multi_day_new_context',taskType:'vocabulary_retrieval_probe',
    story:'Emil kommer hjem og ser våte sko ved døra.\nHan tror at søsteren har vært ute i regnet.\nMen han vet ikke sikkert.',
    question:'Hva kaller vi en forklaring som vi tror kan være riktig, men som vi ikke vet sikkert ennå?'},

  {id:'tela2',kind:'probe',title:'Del 2 · Se på bildet',img:'img/tela2-mangfold.jpg',
    target:'biologisk_mangfold_baseline',researchGoal:'prior_knowledge_before_teaching',taskType:'vocabulary_probe',
    story:'Det finnes mange forskjellige planter og dyr her.',
    question:'Hva kaller vi det når det finnes mange forskjellige arter i naturen?'},

  {id:'tela3a',kind:'display',title:'Del 3 · Vi lærer: biologisk mangfold',img:'img/tela2-mangfold.jpg',
    story:'Biologisk mangfold betyr at det finnes mange forskjellige arter av planter, dyr og andre organismer.\n\nEn skog med mange forskjellige planter, fugler og insekter har stort biologisk mangfold.\n\nHvis det bare finnes én type plante, er mangfoldet mindre.\n\nBiologisk = liv. Mangfold = mange forskjellige.'},
  {id:'tela3b',kind:'probe',title:'Del 3 · Med egne ord',
    target:'biologisk_mangfold_forklart',researchGoal:'comprehension_after_teaching_own_words',taskType:'definition_probe',
    question:'Hva betyr biologisk mangfold? Forklar med dine egne ord.'},

  {id:'tela4a',kind:'probe',title:'Del 4 · En gjetning',img:'img/tela4-bevare.jpg',
    target:'bevare_baseline',researchGoal:'prior_knowledge_before_teaching',taskType:'vocabulary_probe',
    story:'Noen mennesker passer på skogen slik at planter og dyr kan fortsette å leve der.',
    question:'Hva tror du ordet BEVARE betyr?'},
  {id:'tela4b',kind:'display',title:'Del 4 · Vi lærer: bevare',
    story:'Å bevare betyr å passe på noe slik at det ikke blir ødelagt eller forsvinner.'},
  {id:'tela4c',kind:'probe',title:'Del 4 · Hvorfor',
    target:'bevare_arsak',researchGoal:'causal_reasoning_with_contrast',taskType:'inferential_probe',
    story:'Vi kaster søppel i skogen.\nVi passer på skogen.',
    question:'Hva hjelper oss å bevare skogen? Hvorfor?'},

  {id:'tela5a',kind:'probe',title:'Del 5 · Dodoen',img:'img/tela5-dodo.jpg',
    target:'utryddet',researchGoal:'spontaneous_semantic_relation_to_known_word',taskType:'vocabulary_probe',
    story:'Dodoen levde før.\nNå finnes det ingen levende dodoer igjen.',
    question:'Hva betyr det at dodoen er utryddet?'},
  {id:'tela5b',kind:'display',title:'Del 5 · To like ord',
    story:'Utdødd betyr at en art ikke finnes lenger.\nUtryddet betyr at den har blitt fjernet eller dødd ut.'},

  {id:'tela6a',kind:'support_probe',title:'Del 6 · Det viktige spørsmålet',img:'img/tela6-bie.jpg',
    target:'hvorfor_mangfold_viktig',researchGoal:'causal_explanation_biodiversity_retry',taskType:'inferential_probe',
    story:'Det finnes mange forskjellige planter og dyr i naturen.',
    question:'Hvorfor tror du det er bra at det finnes mange forskjellige arter?',
    hints:HVORFOR_HINTS},
  {id:'tela6b',kind:'probe',title:'Del 6 · Etter at vi har lært',
    target:'bevare_mangfold_viktig',researchGoal:'causal_explanation_post_teaching',taskType:'inferential_probe',
    question:'Hvorfor kan det være viktig å bevare forskjellige arter?'},

  {id:'tela7a',kind:'probe',title:'Del 7 · Innsjøen',img:'img/tela7-innsjo.jpg',
    target:'biologisk_mangfold_generalisering',researchGoal:'generalization_new_context',taskType:'definition_probe',
    story:'I denne innsjøen finnes det mange forskjellige fisker, planter, insekter og fugler.',
    question:'Er dette et eksempel på biologisk mangfold? Hvorfor?'},
  {id:'tela7b',kind:'probe',title:'Del 7 · Bevare stedet',
    target:'bevare_generalisering',researchGoal:'generalization_new_context',taskType:'inferential_probe',
    question:'Hva kan mennesker gjøre for å bevare dette stedet?'},
  {id:'tela7c',kind:'probe',title:'Del 7 · Hvis en art forsvinner',
    target:'konsekvens_artforsvinning',researchGoal:'generalization_causal_consequence',taskType:'inferential_probe',
    question:'Hva kan skje hvis en art forsvinner?'},

  {id:'tela8a',kind:'probe',title:'Del 8 · Fortell muntlig',
    target:'bevare_arsak_muntlig',researchGoal:'formulation_oral_spontaneous_no_scaffold',taskType:'sentence_formulation_oral',
    question:'Hvorfor er det viktig å bevare naturen?'},
  {id:'tela8b',kind:'probe',title:'Del 8 · Nå: skriv det',
    target:'bevare_arsak_skriftlig',researchGoal:'formulation_written_after_oral',taskType:'sentence_formulation_written',
    question:'Skriv det du nettopp fortalte.\n\nHvorfor er det viktig å bevare naturen?',recapFrom:'tela8a',noRecapText:true}
];

let planIdx=0;
const answers={};
const trialIds={};
const startedTrials=new Set();
const hintState={}; // per support_probe step: {hintIdx, baselineSaved}
const host=document.getElementById('stepHost');
let questionShownAt=Date.now();

function ensureTrial(step){
  if(trialIds[step.id]) return trialIds[step.id];
  trialIds[step.id]=EdelsData.startTrial(sessionId,{
    target:step.target,researchGoal:step.researchGoal,taskType:step.taskType,modality:'written',
    condition:'naturen_mangfold',question:step.question,context:step.id
  });
  return trialIds[step.id];
}
function markStarted(trialId){
  if(startedTrials.has(trialId)) return;
  startedTrials.add(trialId);
  EdelsData.responseStarted(sessionId,trialId);
}
function setProgress(){
  document.getElementById('count').textContent='Steg '+(planIdx+1)+' av '+PLAN.length;
  document.getElementById('bar').style.width=Math.round(((planIdx+1)/PLAN.length)*100)+'%';
}
function speak(t){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/\n/g,' '));u.lang='nb-NO';speechSynthesis.speak(u)}
function escAttr(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function updateSendBar(){
  const bar=document.getElementById('sendBar');
  if(!bar) return;
  bar.classList.toggle('hidden', Object.keys(answers).length===0);
}
function summaryText(){
  return PLAN.filter(s=>answers[s.id]).map(s=>`${s.title}\n${s.question||''}\n→ ${answers[s.id].text}`).join('\n\n');
}
async function sendPartial(){
  const btn=document.getElementById('sendBarBtn');
  const original=btn.textContent;
  btn.disabled=true; btn.textContent='Sender …';
  try{
    const r=await fetch('https://formspree.io/f/mqeolldg',{
      method:'POST',
      headers:{'Content-Type':'application/json','Accept':'application/json'},
      body:JSON.stringify({
        _subject:'Naturen trenger mange arter – fremgang underveis',
        oppgave:'Naturen trenger mange arter',
        session_id:sessionId,
        Tekst_hun_skrev:summaryText(),
        antall_besvart:Object.keys(answers).length+' av '+PLAN.length,
        dato:new Date().toLocaleString('no-NO')
      }),
      keepalive:true
    });
    if(!r.ok) throw new Error('HTTP '+r.status);
    btn.textContent='✓ Sendt!';
    setTimeout(()=>{btn.textContent=original;btn.disabled=false;},1800);
  }catch(e){
    btn.textContent='Kunne ikke sende – prøv igjen';
    btn.disabled=false;
  }
}
// Samme pålitelige, direkte metode som sendPartial() – ikke via EdelsData sin kø.
async function sendFinal(){
  const statusEl=document.getElementById('sendStatus');
  if(statusEl) statusEl.textContent='Sender til mamma …';
  try{
    const r=await fetch('https://formspree.io/f/mqeolldg',{
      method:'POST',
      headers:{'Content-Type':'application/json','Accept':'application/json'},
      body:JSON.stringify({
        _subject:'Naturen trenger mange arter – fullført økt',
        oppgave:'Naturen trenger mange arter',
        session_id:sessionId,
        Tekst_hun_skrev:summaryText(),
        antall_besvart:Object.keys(answers).length+' av '+PLAN.length,
        status:'fullført',
        dato:new Date().toLocaleString('no-NO')
      }),
      keepalive:true
    });
    if(!r.ok) throw new Error('HTTP '+r.status);
    if(statusEl) statusEl.textContent='✓ Sendt til mamma';
  }catch(e){
    if(statusEl){
      statusEl.textContent='Kunne ikke sende – trykk her for å prøve igjen';
      statusEl.style.cursor='pointer';
      statusEl.onclick=()=>sendFinal();
    }
  }
}

function render(){
  setProgress();
  const step=PLAN[planIdx];
  if(!step){ host.innerHTML=''; return; }
  questionShownAt=Date.now();
  if(step.kind==='display') renderDisplay(step);
  else if(step.kind==='support_probe') renderSupportProbe(step);
  else renderProbe(step);
}

// ---------- Display (undervisning, ingen registrering) ----------
function renderDisplay(step){
  host.innerHTML=`
    <section class="card">
      <div class="step">${step.title}</div>
      ${step.img?`<img class="hero" src="${step.img}" alt="Illustrasjon">`:''}
      <div class="laer">${step.story}</div>
      <div class="btns">
        <button onclick="advanceDisplay()">Neste</button>
        <button class="secondary" onclick="speak(${escAttr(JSON.stringify(step.story))})">🔊 Les opp</button>
      </div>
    </section>`;
}
function advanceDisplay(){ planIdx++; render(); }

// ---------- Vanlig probe (åpent spørsmål) ----------
function renderProbe(step){
  const recap=(step.recapFrom&&answers[step.recapFrom]&&!step.noRecapText)?
    `<div class="recap"><strong>Hun sa nettopp:</strong> ${answers[step.recapFrom].text}</div>`:'';
  const story=step.story?`<div class="story">${step.story}</div>`:'';
  const isLast=planIdx===PLAN.length-1;
  host.innerHTML=`
    <section class="card">
      <div class="step">${step.title}</div>
      ${step.img?`<img class="hero" src="${step.img}" alt="Illustrasjon">`:''}
      ${story}
      ${recap}
      <p class="q">${step.question}</p>
      <div class="mic">🎤 Hun kan svare muntlig også – skriv det hun sier.</div>
      <textarea id="probeInput" placeholder="Skriv svaret her …"></textarea>
      <label class="oral"><input type="checkbox" id="probeOral"> Hun sa det høyt før hun skrev</label>
      <div class="btns">
        <button onclick="saveProbe()">${isLast?'Fullfør økten':'Lagre svaret'}</button>
        ${step.story?`<button class="secondary" onclick="speak(${escAttr(JSON.stringify(step.story+' '+step.question))})">🔊 Les opp</button>`:''}
      </div>
      <div id="doneBox" class="hidden">
        <div class="ok">🌟 Ferdig! Bra jobbet i dag.</div>
        <div id="sendStatus" class="small" style="margin-top:0.5rem;color:var(--muted)"></div>
      </div>
    </section>`;
  const tid=ensureTrial(step);
  document.getElementById('probeInput').addEventListener('input',()=>markStarted(tid),{once:true});
}
function saveProbe(){
  const step=PLAN[planIdx];
  const val=document.getElementById('probeInput').value;
  if(!val.trim()){alert('Skriv et svar først.');return}
  const oral=document.getElementById('probeOral').checked;
  const tid=ensureTrial(step);
  EdelsData.saveFirstResponse(sessionId,tid,val,{source:'naturen_ui',oral,latencyMs:Date.now()-questionShownAt});
  answers[step.id]={text:val,oral};
  updateSendBar();
  const isLast=planIdx===PLAN.length-1;
  if(isLast){
    EdelsData.completeSession(sessionId);
    sendFinal();
    document.getElementById('doneBox').classList.remove('hidden');
    document.querySelector('#stepHost button[onclick="saveProbe()"]').disabled=true;
    const bar=document.getElementById('sendBar');
    if(bar) bar.classList.add('hidden');
    planIdx++; setProgress();
    return;
  }
  planIdx++; render();
}

// ---------- Support probe (gradert hjelp, bare hvis nødvendig) ----------
function renderSupportProbe(step){
  const st=hintState[step.id] || (hintState[step.id]={baselineSaved:false,hintIdx:-1});
  const story=step.story?`<div class="story">${step.story}</div>`:'';
  let hintBlock='';
  if(st.hintIdx>=0){
    const h=step.hints[st.hintIdx];
    hintBlock=`<div class="hint"><strong>Pekepinn ${st.hintIdx+1}:</strong> ${h.text}</div>`;
    if(!h.explicit){
      hintBlock+=`<textarea id="hintInput" placeholder="Nytt svar, hvis hun vil prøve igjen …"></textarea>`;
    }
  }
  const baselineShown = st.baselineSaved ? `<div class="recap"><strong>Hun svarte først:</strong> ${answers[step.id+'__baseline']?.text||''}</div>` : '';

  let actionButtons='';
  if(!st.baselineSaved){
    actionButtons=`<div class="btns">
      <button onclick="saveSupportBaseline()">Lagre svaret</button>
      <button class="secondary" onclick="speak(${escAttr(JSON.stringify((step.story||'')+' '+step.question))})">🔊 Les opp</button>
    </div>`;
  } else if(st.hintIdx===-1){
    actionButtons=`<div class="btns">
      <button onclick="advanceSupportProbe()">Hun klarte det – gå videre</button>
      <button class="secondary" onclick="giveNextHint()">Hun trenger en pekepinn</button>
    </div>`;
  } else {
    const h=step.hints[st.hintIdx];
    if(h.explicit){
      actionButtons=`<div class="btns"><button onclick="advanceSupportProbe()">Gå videre</button></div>`;
    } else {
      actionButtons=`<div class="btns">
        <button onclick="saveSupportResponse()">Lagre nytt svar</button>
        <button class="secondary" onclick="giveNextHint()">Enda en pekepinn</button>
      </div>`;
    }
  }

  host.innerHTML=`
    <section class="card">
      <div class="step">${step.title}</div>
      ${step.img?`<img class="hero" src="${step.img}" alt="Illustrasjon">`:''}
      ${story}
      <p class="q">${step.question}</p>
      ${!st.baselineSaved?`
        <div class="mic">🎤 Hun kan svare muntlig også – skriv det hun sier.</div>
        <textarea id="probeInput" placeholder="Skriv svaret her …"></textarea>
        <label class="oral"><input type="checkbox" id="probeOral"> Hun sa det høyt før hun skrev</label>
      `:baselineShown+hintBlock}
      ${actionButtons}
    </section>`;
  const tid=ensureTrial(step);
  const inputEl=document.getElementById('probeInput');
  if(inputEl) inputEl.addEventListener('input',()=>markStarted(tid),{once:true});
}
function saveSupportBaseline(){
  const step=PLAN[planIdx];
  const val=document.getElementById('probeInput').value;
  if(!val.trim()){alert('Skriv et svar først.');return}
  const oral=document.getElementById('probeOral').checked;
  const tid=ensureTrial(step);
  EdelsData.saveFirstResponse(sessionId,tid,val,{source:'naturen_ui',oral,latencyMs:Date.now()-questionShownAt});
  answers[step.id+'__baseline']={text:val,oral};
  answers[step.id]={text:val,oral}; // beste svar så langt, for delvis-sending
  updateSendBar();
  hintState[step.id].baselineSaved=true;
  renderSupportProbe(step);
}
function giveNextHint(){
  const step=PLAN[planIdx];
  const st=hintState[step.id];
  const nextIdx=st.hintIdx+1;
  if(nextIdx>=step.hints.length) return;
  const h=step.hints[nextIdx];
  EdelsData.addSupport(sessionId,ensureTrial(step),nextIdx+1,h.explicit?'explicit_model':'hint',h.text);
  st.hintIdx=nextIdx;
  renderSupportProbe(step);
}
function saveSupportResponse(){
  const step=PLAN[planIdx];
  const st=hintState[step.id];
  const val=document.getElementById('hintInput').value;
  if(!val.trim()){alert('Skriv et svar først.');return}
  EdelsData.setSupportResponse(sessionId,ensureTrial(step),st.hintIdx,val);
  answers[step.id]={text:val,oral:false};
  updateSendBar();
  renderSupportProbe(step);
}
function advanceSupportProbe(){ planIdx++; render(); }

render();
