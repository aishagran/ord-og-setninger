<style>

.hidden{display:none}

const byId=Object.fromEntries(ITEMS.map(i=>[i.id,i]));

/* ---------- lagring ---------- */
const jget=(k,f)=>{try{return JSON.parse(localStorage.getItem(k))??f}catch(e){return f}};
const jset=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const outcomes=()=>jget(OUT_KEY,[]);

/* ---------- planlegging ---------- */
function conceptState(c){
  const outs=outcomes().filter(o=>o.concept===c).sort((a,b)=>a.at-b.at);
  if(!outs.length)return {kind:'untested'};
  const last=outs[outs.length-1];
  let streak=0; for(let k=outs.length-1;k>=0&&outs[k].firstMatched;k--)streak++;
  if(last.firstMatched){
    const iv=RULES.independentIntervals[Math.min(streak,RULES.independentIntervals.length)-1];
    return {kind:'independent',last,streak,due:last.at+iv*DAY,interval:iv};
  }
  if(last.minLevel!=null||last.retestMatched)return {kind:'with_help',last,due:last.at+RULES.withHelpDue*DAY};
  return {kind:'not_retrieved',last,due:last.at+RULES.notRetrievedDue*DAY};
}
function itemScore(it,chosen){
  const st=conceptState(it.c), now=Date.now(); let s=0;
  if(st.kind==='untested')s=RULES.untestedScore;
  else if(st.kind==='not_retrieved')s=100;
  else if(st.kind==='with_help')s=80+Math.max(0,(now-st.due)/DAY);
  else s=now>=st.due?40+Math.min(30,(now-st.due)/DAY):-20;
  if(st.last&&st.last.genMatched===false)s+=15;
  if(st.last&&st.last.itemId===it.id)s-=30; // ikke samme spørsmål to ganger på rad
  if(chosen.some(x=>x.c===it.c))s-=40;
  return s+Math.random()*10;
}
function makePlan(){
  const chosen=[];
  AREA_ORDER.forEach(a=>{
    const cands=ITEMS.filter(i=>i.a===a).map(i=>({i,s:itemScore(i,chosen)})).sort((x,y)=>y.s-x.s);
    chosen.push(cands[0].i);
  });
  return chosen.map(i=>i.id);
}

/* ---------- økt ---------- */
let S=null; // {sessionId, plan, i, stage, hintIdx, supIdx, trials:{}, rec:{}}
const host=document.getElementById('stepHost');
const saveState=()=>{ if(S)jset(ST_KEY,S); };
function newSession(){
  const sessionId=EdelsData.createSession({title:MODULE_TITLE+' – generell revisjon',researchGoal:'adaptive_review_retention_generalization',schoolSubject:'revisjon'});
  S={sessionId,plan:makePlan(),i:0,stage:'first',hintIdx:0,supIdx:null,trials:{},rec:{},startedAt:Date.now(),shownAt:Date.now()};
  S.stage=needsPreTeach(byId[S.plan[0]])?'preteach':'first';
  saveState(); render();
}
function needsPreTeach(it){ return conceptState(it.c).kind==='not_retrieved'; }
const cur=()=>byId[S.plan[S.i]];
function prefixFor(it,stage){ const p=it.pre; if(!p)return null; if(typeof p==='string')return p; return p[stage==='help'?'first':stage]||p.first; }
function specFor(it,stage){ return stage==='retest'?(it.racc||it.acc):stage==='gen'?(it.gacc||it.acc):it.acc; }
function ok(spec,t){ if(!spec)return false; return Array.isArray(spec)?spec.every(r=>r.test(t)):spec.test(t); }
function speak(t){ try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(t).replace(/\n/g,' '));u.lang='nb-NO';u.rate=0.9;speechSynthesis.speak(u);}catch(e){} }
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function trialFor(it){
  if(!S.trials[it.id]){
    const st=conceptState(it.c);
    const days=st.last?Math.round((Date.now()-st.last.at)/DAY):null;
    S.trials[it.id]=EdelsData.startTrial(S.sessionId,{target:it.c,researchGoal:it.goal,taskType:'area_'+it.a,modality:'written',
      condition:'revisjon_'+(S.pre===it.id?'etter_ny_undervisning':'revisjon'),question:it.q,context:it.id,retentionIntervalDays:days});
    saveState();
  }
  return S.trials[it.id];
}

/* ---------- visning ---------- */
function setProgress(){
  const n=S?Math.min(S.i+1,S.plan.length):0;
  document.getElementById('count').textContent=S?('Oppgave '+n+' av '+S.plan.length):'Start';
  document.getElementById('bar').style.width=(S?Math.round(n/S.plan.length*100):6)+'%';
}
function pauseBtn(){ return '<div class="btns"><button class="secondary" onclick="pauseSession()">⏸ Ta en pause</button></div>'; }
function render(){
  setProgress();
  if(!S){ return renderStart(); }
  if(S.stage==='done')return renderDone();
  const it=cur(); shownAt=Date.now();
  if(S.stage==='preteach'||S.stage==='teach')return renderTeach(it);
  return renderQuestion(it);
}
let shownAt=Date.now();
function renderStart(){
  const st=jget(ST_KEY,null);
  let resume='';
  if(st&&st.stage!=='done'&&EdelsData.getSession(st.sessionId)&&EdelsData.getSession(st.sessionId).status!=='completed'){
    resume='<div class="btns"><button onclick="resumeSession()">Fortsett der vi slapp</button></div>';
  }
  host.innerHTML=`<section class="card"><div class="step">Revisjon</div>
    <div class="laer">Hei, Edel!\n\nI dag ser vi på ting du har lært før. Det er sju oppgaver.\n\nDu kan skrive med dine egne ord. Du kan skrive «jeg vet ikke». Du kan ta pause når du vil.</div>
    ${resume}
    <div class="btns"><button onclick="newSession()">${resume?'Start en ny økt':'Start'}</button>
    <button class="secondary" onclick="speak('Hei Edel! I dag ser vi på ting du har lært før. Det er sju oppgaver. Du kan skrive med dine egne ord. Du kan skrive jeg vet ikke. Du kan ta pause når du vil.')">🔊 Les opp</button></div></section>`;
}
function resumeSession(){ S=jget(ST_KEY,null); if(S)render(); }
function pauseSession(){
  saveState();
  host.innerHTML=`<section class="card"><div class="step">Pause</div>
    <div class="laer">Fint! Du kan ta en pause nå.\n\nNår du er klar, åpner du siden igjen og trykker «Fortsett der vi slapp».</div>
    <div class="btns"><button onclick="render()">Fortsett nå</button></div></section>`;
}
function renderTeach(it){
  const pre=S.stage==='preteach';
  host.innerHTML=`<section class="card"><div class="step">${pre?'Vi øver på et ord først':'La oss se på det sammen'}</div>
    <div class="laer">${esc(it.teach)}</div>
    <div class="btns"><button onclick="afterTeach()">Jeg har lest</button>
    <button class="secondary" onclick="speak(${esc(JSON.stringify(it.teach))})">🔊 Les opp</button></div>${pauseBtn()}</section>`;
  if(!pre&&!S.teachLogged){ EdelsData.addSupport(S.sessionId,trialFor(it),7,'ensino',it.teach,null); S.teachLogged=true; saveState(); }
}
function afterTeach(){
  if(S.stage==='preteach'){ S.stage='first'; S.pre=cur().id; }
  else { S.stage='retest'; }
  saveState(); render();
}
function renderQuestion(it){
  const stage=S.stage;
  const labels={first:'Spørsmål',help:'En liten hjelp',retest:'Prøv igjen, uten hjelp',gen:'Ny situasjon'};
  const q=stage==='retest'?it.rq:stage==='gen'?it.gq:it.q;
  const text=stage==='retest'?it.rtext:stage==='gen'?null:it.text;
  const pre=prefixFor(it,stage);
  let hintHtml='';
  if(stage==='help'){
    const h=it.hints[S.hintIdx];
    hintHtml=`<div class="laer" style="margin-top:.7rem">${esc(h.t)}</div>`;
    if(S.supIdx!==S.hintIdx||S.loggedHint!==S.hintIdx){
      const tid=trialFor(it);
      EdelsData.addSupport(S.sessionId,tid,h.l,'hint',h.t,null);
      S.supIdx=(EdelsData.getSession(S.sessionId)?.trials.find(t=>t.trialId===tid)?.supports.length||1)-1;
      S.loggedHint=S.hintIdx; saveState();
      if(h.rep)setTimeout(()=>speak(q),300);
    }
  }
  host.innerHTML=`<section class="card"><div class="step">${labels[stage]}</div>
    ${text?`<div class="story">${esc(text)}</div>`:''}
    <p class="q">${esc(q)}</p>${hintHtml}
    ${pre?`<div class="story" style="margin-top:.7rem"><strong>${esc(pre)} …</strong></div>`:''}
    <textarea id="ans" placeholder="${pre?'Skriv det som kommer etterpå …':'Skriv svaret her …'}"></textarea>
    <div class="btns"><button onclick="submitAnswer()">Lagre svaret</button>
    <button class="secondary" onclick="submitAnswer(true)">Jeg vet ikke</button>
    <button class="secondary" onclick="speak(${esc(JSON.stringify((text?text+' ':'')+q))})">🔊 Les opp</button></div>${pauseBtn()}</section>`;
  const el=document.getElementById('ans'); const tid=trialFor(it);
  if(stage==='first')el.addEventListener('input',()=>EdelsData.responseStarted(S.sessionId,tid),{once:true});
}

/* ---------- svar ---------- */
function submitAnswer(dontKnow){
  const it=cur(), stage=S.stage, tid=trialFor(it), pre=prefixFor(it,stage);
  const raw=document.getElementById('ans').value.trim();
  if(!raw&&!dontKnow){ alert('Skriv et svar, eller trykk «Jeg vet ikke».'); return; }
  const typed=dontKnow&&!raw?'jeg vet ikke':raw;
  const full=pre?(dontKnow&&!raw?pre+' … (jeg vet ikke)':pre+' '+raw):typed;
  const matched=dontKnow&&!raw?false:ok(specFor(it,stage),pre?raw:full);
  const rec=S.rec[it.id]||(S.rec[it.id]={itemId:it.id,concept:it.c,area:it.a,minLevel:null,taught:false});
  const latency=Date.now()-shownAt;
  if(stage==='first'){
    EdelsData.saveFirstResponse(S.sessionId,tid,full,{source:'revisjon_ui',latencyMs:latency,dontKnow:!!(dontKnow&&!raw)});
    rec.firstText=full; rec.firstMatched=matched;
    if(it.a==='G'){ EdelsData.saveGeneralization(S.sessionId,tid,it.q,full); rec.genMatched=matched; rec.genText=full; }
    if(matched){ S.stage=(it.a!=='G'&&it.gq)?'gen':'next'; }
    else { S.stage='help'; S.hintIdx=0; S.supIdx=null; S.loggedHint=null; }
  } else if(stage==='help'){
    EdelsData.setSupportResponse(S.sessionId,tid,S.supIdx,full);
    (rec.helpAnswers||(rec.helpAnswers=[])).push({level:it.hints[S.hintIdx].l,response:full});
    if(matched){ rec.minLevel=it.hints[S.hintIdx].l; S.stage='retest'; }
    else if(S.hintIdx+1<it.hints.length){ S.hintIdx++; }
    else { rec.taught=true; S.teachLogged=false; S.stage='teach'; }
  } else if(stage==='retest'){
    EdelsData.saveSupportRemoved(S.sessionId,tid,full); rec.retestText=full; rec.retestMatched=matched; S.stage='next';
  } else if(stage==='gen'){
    EdelsData.saveGeneralization(S.sessionId,tid,it.gq,full); rec.genText=full; rec.genMatched=matched; S.stage='next';
  }
  if(S.stage==='next')return finishItem();
  saveState(); render();
}
function finishItem(){
  const it=cur(), rec=S.rec[it.id]; rec.at=Date.now(); rec.sessionId=S.sessionId; rec.trialId=S.trials[it.id];
  const o=outcomes(); o.push(rec); jset(OUT_KEY,o);
  S.i++; S.teachLogged=false;
  if(S.i>=S.plan.length){ S.stage='done'; EdelsData.finishAndSubmit(S.sessionId); saveState(); return render(); }
  S.stage=needsPreTeach(cur())?'preteach':'first'; S.hintIdx=0; S.supIdx=null; S.loggedHint=null;
  saveState(); render();
}

  const lines=[];
  S.plan.forEach(id=>{
    const it=byId[id], r=S.rec[id]; if(!r||!it.praise)return;
    const w=it.praise.find(p=>new RegExp(p,'i').test((r.firstText||'')));
    if(w&&r.firstMatched)lines.push('Du brukte ordet «'+w+'» uten hjelp.');
  });
  return lines.slice(0,3);
}
function renderDone(){
  const pr=praiseLines();
  host.innerHTML=`<section class="card"><div class="step">Ferdig</div>
    <div class="ok">Bra jobbet, Edel! Du svarte på alle de sju oppgavene.${pr.length?'<br>'+pr.join('<br>'):''}</div>
    <div id="sendStatus" class="small" style="margin-top:.6rem">Sender til mamma …</div>
    <details class="voksen"><summary>Til voksen</summary>${adultHtml()}</details></section>`;
  document.getElementById('bar').style.width='100%';
  document.getElementById('count').textContent='Ferdig';
  setTimeout(()=>{ const s=EdelsData.getSession(S.sessionId); const el=document.getElementById('sendStatus');
    if(el)el.textContent=(s&&s.submission&&s.submission.status==='sent')?'✓ Sendt til mamma':'Lagret på denne enheten. Sendes når nettet er tilgjengelig.'; },2500);
}

/* ---------- voksenpanel ---------- */
const CLASSES=['—','exata','conceitualmente correta com outras palavras','aproximação semântica','substituição semântica','circunlocução','conhecimento parcial','erro de formulação','erro gramatical','erro de sequência/causalidade','não recuperou','não respondeu / tarefa difícil','autocorreção'];
const CONCEPT_OPT=['—','sim','parcial','não demonstrado','indeterminado'];
const WORD_OPT=['—','independentemente','após pista','após modelo','não recuperada'];
function statusText(r){
  if(r.firstMatched)return 'Sozinha (primeira resposta contém critério)';
  if(r.minLevel!=null)return 'Com apoio — nível mínimo '+r.minLevel;
  if(r.retestMatched)return 'Só após ensino (retirada: critério presente)';
  return 'Não recuperou nesta sessão';
}
function nextReviewText(){
  return [...new Set(S.plan.map(id=>byId[id].c))].map(c=>{
    const st=conceptState(c); let when,why;
    if(st.kind==='independent'){ when='em '+st.interval+' dia(s)'; why='recuperou sozinha; intervalo aumenta (regra configurável)'; }
    else if(st.kind==='with_help'){ when='em '+RULES.withHelpDue+' dia(s)'; why='precisou de apoio; revisar mais cedo'; }
    else { when='próxima sessão, com ensino antes'; why='não recuperou; ensinar de novo antes de testar'; }
    return '• '+CONCEPTS[c].n+': '+when+' — '+why;
  }).join('\n');
}
function adultHtml(){
  const rows=S.plan.map((id,k)=>{
    const it=byId[id], r=S.rec[id]||{};
    const helps=(r.helpAnswers||[]).map(h=>'nível '+h.level+': «'+h.response+'»').join(' · ')||'—';
    return `<div class="vpanel" data-id="${id}"><h3>${k+1}. ${esc(CONCEPTS[it.c].n)} <span class="small">(${esc(AREAS[it.a])}${CONCEPTS[it.c].t?' · nível '+CONCEPTS[it.c].t:''})</span></h3>
      <p class="small">${esc(it.q)}</p>
      <p><strong>Primeira resposta literal:</strong> ${esc(r.firstText||'—')}</p>
      <p class="small">Forslag automático (apenas sugestão, não avaliação): ${r.firstMatched?'contém critério':'não contém critério'} · ${esc(statusText(r))}</p>
      <p class="small"><strong>Pistas e respostas depois delas:</strong> ${esc(helps)}</p>
      ${r.taught?'<p class="small">Ensino apresentado: sim</p>':''}
      <p class="small"><strong>Após retirada do apoio:</strong> ${esc(r.retestText||'—')}</p>
      <p class="small"><strong>Generalização:</strong> ${esc(r.genText||'—')}</p>
      <label class="small">Classificação <select class="cl">${CLASSES.map(c=>`<option>${c}</option>`).join('')}</select></label><br>
      <label class="small">Conceito demonstrado <select class="cd">${CONCEPT_OPT.map(c=>`<option>${c}</option>`).join('')}</select></label><br>
      <label class="small">Palavra-alvo <select class="pw">${WORD_OPT.map(c=>`<option>${c}</option>`).join('')}</select></label></div>`;
  }).join('');
  return `<p class="small">Resumo desta sessão. As classificações são suas; o site só sugere. Uma única observação não estabelece padrão.</p>
    ${rows}
    <div class="vpanel"><h3>Próximas revisões (regras configuráveis)</h3><pre class="small" style="white-space:pre-wrap">${esc(nextReviewText())}</pre>
    <p class="small">Mikronovelle: planejada para a sessão seguinte, usando estas observações para ajustar a complexidade. Ainda não construída.</p></div>
    <textarea id="adultNotes" placeholder="Observações da sessão (situação, cansaço, o que ela disse em voz alta …)"></textarea>
    <div class="btns"><button onclick="saveInterpretations()">Salvar classificações</button><button onclick="copyAdult()">Copiar registro completo</button></div>
    <div id="copyStatus" class="small" style="margin-top:.4rem"></div>`;
}
function readInterp(){
  return [...document.querySelectorAll('.vpanel[data-id]')].map(el=>({id:el.dataset.id,cl:el.querySelector('.cl').value,cd:el.querySelector('.cd').value,pw:el.querySelector('.pw').value}));
}
function saveInterpretations(){
  readInterp().forEach(x=>{ if(x.cl==='—'&&x.cd==='—'&&x.pw==='—')return;
    EdelsData.interpret(S.sessionId,S.trials[x.id],{conceptDemonstrated:x.cd==='—'?null:x.cd,targetWordRetrieved:x.pw==='—'?null:x.pw,responseClassification:x.cl==='—'?null:x.cl,notes:(document.getElementById('adultNotes')||{}).value||null}); });
  document.getElementById('copyStatus').textContent='✓ Salvo neste aparelho';
}
async function copyAdult(){
  const interp=readInterp();
  const body=S.plan.map((id,k)=>{ const it=byId[id], r=S.rec[id]||{}, x=interp.find(i=>i.id===id)||{};
    return (k+1)+'. '+CONCEPTS[it.c].n+' ['+AREAS[it.a]+']\nPergunta: '+it.q+'\nPrimeira resposta (literal): '+(r.firstText||'—')+
      '\nPistas: '+((r.helpAnswers||[]).map(h=>'nível '+h.level+' → «'+h.response+'»').join(' | ')||'—')+(r.taught?'\nEnsino apresentado: sim':'')+
      '\nApós retirada do apoio: '+(r.retestText||'—')+'\nGeneralização: '+(r.genText||'—')+
      '\nSugestão automática: '+statusText(r)+'\nClassificação do adulto: '+(x.cl||'—')+' | conceito: '+(x.cd||'—')+' | palavra: '+(x.pw||'—'); }).join('\n\n');
  const text='EDELS VERDEN — REVISÃO GERAL\n(Sessão '+new Date(S.startedAt).toLocaleString('no-NO')+')\n\n'+body+'\n\nPRÓXIMAS REVISÕES\n'+nextReviewText()+'\n\nObservações:\n'+((document.getElementById('adultNotes')||{}).value||'');
  const st=document.getElementById('copyStatus');
  try{ await navigator.clipboard.writeText(text); st.textContent='✓ Copiado'; }
  catch(e){ const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');st.textContent='✓ Copiado';}catch(e2){st.textContent='Não foi possível copiar';} ta.remove(); }
}

render();
</script></body></html>
