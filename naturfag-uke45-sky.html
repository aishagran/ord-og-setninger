<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hvordan dannes en sky? – Naturfag uke 45</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--cream:#F6F1E6;--paper:#FFFEFA;--navy:#1C2C42;--navy-2:#29455F;--ink:#1B2438;--muted:#746F66;--coral:#BE6E56;--coral-soft:#F3DFD6;--rule:#E4DCCB;--green:#E4F0DF;--shadow:0 12px 34px rgba(28,44,66,0.08)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:radial-gradient(circle at 10% 0%,#FFF9EE 0,transparent 24rem),var(--cream);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}
main{max-width:680px;margin:auto;padding:1.4rem 1.2rem 3rem}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.top strong{font-family:'Fraunces',serif;font-weight:600;font-size:1.2rem}
.top a{color:inherit;text-decoration:none}
.small{font-size:0.82rem;color:var(--muted);margin-top:0.15rem}
.pill{background:var(--paper);border:1px solid var(--rule);border-radius:999px;padding:0.5rem 0.9rem;font-weight:700;font-size:0.85rem;flex-shrink:0;white-space:nowrap}
.progress{height:8px;background:var(--rule);border-radius:9px;overflow:hidden;margin-top:0.9rem}
.bar{height:100%;background:var(--coral);width:6%;transition:width 0.25s ease}
.card{background:var(--paper);border:1px solid rgba(28,44,66,0.08);border-radius:22px;padding:1.4rem;margin-top:1rem;box-shadow:0 7px 24px rgba(28,44,66,0.045)}
.step{font-weight:700;font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--coral)}
.hero{width:100%;max-height:420px;object-fit:contain;border-radius:16px;margin:0.9rem 0;display:block;background:var(--cream)}
.story{background:var(--cream);border:1px dashed var(--rule);border-radius:14px;padding:0.85rem 1rem;font-size:0.95rem;color:var(--ink);line-height:1.6;margin-top:0.6rem;white-space:pre-line}
.laer{background:var(--green);border:1px solid #CFE4CA;border-radius:14px;padding:0.9rem 1rem;font-size:0.95rem;color:#2F5137;line-height:1.65;margin-top:0.6rem;white-space:pre-line}
.q{font-family:'Fraunces',serif;font-size:1.22rem;font-weight:500;line-height:1.34;margin-top:0.9rem;white-space:pre-line}
.mic{font-size:0.82rem;color:var(--muted);margin-top:0.4rem}
textarea,input[type=text]{width:100%;font:inherit;font-family:'Inter',sans-serif;border:2px solid var(--rule);border-radius:14px;padding:0.85rem;background:var(--paper);min-height:52px;margin-top:0.6rem;color:var(--ink)}
textarea{min-height:90px;margin-top:0.9rem}
textarea:focus,input:focus{outline:2px solid var(--coral);outline-offset:1px;border-color:var(--coral)}
.flex-row{display:flex;align-items:center;gap:0.7rem;margin-top:0.5rem}
.flex-row label{min-width:6.2rem;font-weight:600}
.flex-row input{margin-top:0}
.btns{display:flex;gap:0.6rem;flex-wrap:wrap;margin-top:0.9rem}
button{border:0;border-radius:999px;padding:0.7rem 1.1rem;font:inherit;font-weight:700;font-size:0.88rem;background:var(--navy);color:#EDE6D6;cursor:pointer}
button.secondary{background:var(--coral-soft);color:#7A4530}
button:disabled{opacity:0.45;cursor:default}
.hidden{display:none}
.ok{background:var(--green);color:#3E6C4A;padding:0.8rem 1rem;border-radius:14px;margin-top:0.9rem;font-weight:600}
.later{text-align:center;margin:1.6rem 0 .5rem}.later.hidden{display:none}.linkbtn{background:none;color:var(--muted);font-weight:500;font-size:.8rem;text-decoration:underline;padding:.5rem}.sendbtn{background:var(--coral);color:#fff;margin-top:.7rem}
.opts{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.9rem}.opts button{background:var(--paper);color:var(--navy);border:2px solid var(--rule);font-size:1rem;padding:.8rem 1.3rem}.opts button.picked{background:var(--navy);color:#EDE6D6;border-color:var(--navy)}.opts button:disabled{opacity:.7}.ordbig{font-family:"Fraunces",serif;font-size:1.7rem;font-weight:600;color:var(--navy)}.chips{display:flex;flex-direction:column;gap:.5rem;margin-top:.8rem}.chip{background:var(--paper);color:var(--ink);border:2px solid var(--rule);border-radius:14px;text-align:left;font-weight:500;font-size:.95rem;padding:.7rem .9rem}.chip.sel{background:var(--green);border-color:#9CC79A}.stm{border-top:1px solid var(--rule);padding:.7rem 0}.stm p{font-size:.98rem;line-height:1.45}.stm .opts{margin-top:.4rem}.stm .opts button{font-size:.9rem;padding:.55rem 1rem}.gloss{background:var(--cream);border:1px dashed var(--rule);border-radius:12px;padding:.6rem .8rem;font-size:.85rem;color:var(--muted);line-height:1.5;margin-top:.6rem;white-space:pre-line}.inl{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem;border:2px solid var(--rule);border-radius:14px;padding:.55rem .7rem;margin-top:.9rem;background:var(--paper)}.inl .pf{font-weight:600;color:var(--navy)}.inl input{flex:1;min-width:8rem;border:0;margin:0;padding:.3rem;min-height:36px;background:transparent}.inl input:focus{outline:none}.inl:focus-within{border-color:var(--coral)}.ikke{background:var(--coral-soft);border:1px solid #E8C9BA;border-radius:14px;padding:.8rem 1rem;font-size:.95rem;color:#7A4530;line-height:1.6;margin-top:.6rem;white-space:pre-line}
@media(max-width:600px){main{padding:1rem 0.9rem 3rem}.card{padding:1.05rem}.q{font-size:1.1rem}}
</style></head>
<body><main>
<div class="top"><div><strong><a href="index.html">☁️ Hvordan dannes en sky?</a></strong><div class="small">Naturfag · uke 45 · Oppgave 1</div></div><div class="pill" id="count">Les teksten</div></div>
<div class="progress"><div class="bar" id="bar"></div></div>
<div id="stepHost"></div>
</main>
<div class="later hidden" id="sendBar"><button class="linkbtn" id="sendBarBtn" onclick="sendPartial()">Må du slutte nå? Send det som er gjort til mamma</button></div>
<script src="edels-data.js"></script>
<script>
if(typeof EdelsData==='undefined'){
  window.EdelsData={createSession:()=>'offline-'+Date.now(),getSession:()=>null,startTrial:()=>'t-'+Date.now()+'-'+Math.random(),responseStarted:()=>{},saveFirstResponse:()=>{},completeSession:()=>{},finishAndSubmit:()=>{},interpret:()=>{},addSupport:()=>{},setSupportResponse:()=>{}};
}
const TITLE='Naturfag uke 45 – Hvordan dannes en sky? (oppgave 1)';
const SESSION_KEY='edels_naturfag_uke45_sky_v1_session';
const GOAL='science_text_comprehension_water_cycle_first_unsupported';
let sessionId=null;
try{ sessionId=localStorage.getItem(SESSION_KEY); }catch(e){}
try{
  if(!sessionId || !EdelsData.getSession(sessionId) || EdelsData.getSession(sessionId).status==='completed'){
    sessionId=EdelsData.createSession({title:TITLE,researchGoal:GOAL,schoolSubject:'naturfag'});
    try{ localStorage.setItem(SESSION_KEY,sessionId); }catch(e){}
  }
}catch(e){ sessionId=EdelsData.createSession({title:TITLE,researchGoal:GOAL,schoolSubject:'naturfag'}); }
const TEXT='Solen varmer opp vannet i en innsjø. Noe av vannet blir til vanndamp og stiger opp i luften.\n\nHøyt oppe blir vanndampen kaldere. Da dannes små vanndråper. Mange små vanndråper samler seg og danner en sky.';
const QS=[
 {id:'q1',n:1,q:'Hva skjer med vannet når solen varmer det opp?',target:'vann_varmes_blir_vanndamp',type:'reading_comprehension'},
 {id:'q2',n:2,q:'Hva skjer med vanndampen når den blir kaldere?',target:'vanndamp_kaldere_blir_dråper',type:'reading_comprehension'},
 {id:'q3',n:3,q:'Hva betyr ordet «danne» i denne teksten?',target:'ordforklaring_danne',type:'word_meaning_explanation'}
];
const PLAN=[{id:'les',type:'les'}].concat(QS);
let planIdx=0; const answers={}, trialIds={}, started=new Set();
const host=document.getElementById('stepHost'); let shownAt=Date.now();
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function ensureTrial(s){
  if(trialIds[s.id]) return trialIds[s.id];
  trialIds[s.id]=EdelsData.startTrial(sessionId,{target:s.target,researchGoal:GOAL,taskType:s.type,modality:'written',condition:'naturfag_uke45_sky|apent_svar_uten_hjelp',question:s.q,context:TEXT.replace(/\n+/g,' '),retentionIntervalDays:0});
  return trialIds[s.id];
}
function speak(t,s){ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(String(t).replace(/\n/g,' ')); u.lang='nb-NO'; u.rate=0.9; speechSynthesis.speak(u);
  if(s){ try{ EdelsData.addSupport(sessionId,ensureTrial(s),1,'repetition_read_aloud','Les opp trykket',null); }catch(e){} } }
function textBox(){ return `<img class="hero" src="img/vannets-kretslop.jpg" alt="Tegning: sol, innsjø, skyer og regn" onerror="this.style.display='none'"><div class="laer">${esc(TEXT)}</div>`; }
function setProgress(){ document.getElementById('count').textContent=planIdx>=PLAN.length?'Ferdig':(planIdx===0?'Les teksten':'Spørsmål '+planIdx+' av 3');
  document.getElementById('bar').style.width=Math.round(Math.min(planIdx,PLAN.length)/PLAN.length*100)+'%';
  document.getElementById('sendBar').classList.toggle('hidden',Object.keys(answers).length===0||planIdx>=PLAN.length); }
function summaryText(){ return QS.filter(q=>answers[q.id]).map(q=>`${q.n}. ${q.q}\n→ Svar: ${answers[q.id].text}`).join('\n\n'); }
async function post(subject,extra){
  const r=await fetch('https://formspree.io/f/mqeolldg',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},keepalive:true,
    body:JSON.stringify(Object.assign({_subject:subject,oppgave:TITLE,session_id:sessionId,Tekst_hun_skrev:summaryText(),antall_besvart:Object.keys(answers).length+' av '+QS.length,dato:new Date().toLocaleString('no-NO')},extra))});
  if(!r.ok) throw new Error('HTTP '+r.status); }
async function sendPartial(){ const b=document.getElementById('sendBarBtn'),o=b.textContent; b.disabled=true;b.textContent='Sender …';
  try{ await post(TITLE+' – fremgang underveis',{}); b.textContent='✓ Sendt!'; setTimeout(()=>{b.textContent=o;b.disabled=false},1800); }
  catch(e){ b.textContent='Kunne ikke sende – trykk for å prøve igjen'; b.disabled=false; } }
function render(){
  setProgress(); const s=PLAN[planIdx]; if(!s) return renderEnd(); shownAt=Date.now();
  if(s.type==='les'){
    host.innerHTML=`<section class="card"><div class="step">Oppgave 1</div><p class="q">Hvordan dannes en sky?</p><div class="mic">Les teksten. Så kommer tre spørsmål.</div>${textBox()}
     <div class="btns"><button onclick="planIdx++;render()">Jeg har lest →</button><button class="secondary" onclick="speak(TEXT)">🔊 Les opp</button></div></section>`;
  } else {
    host.innerHTML=`<section class="card"><div class="step">Spørsmål ${s.n} av 3</div>${textBox()}<p class="q">${s.n}. ${esc(s.q)}</p>
     <div class="mic">Skriv med dine egne ord. Du kan skrive «jeg vet ikke».</div><textarea id="ans" placeholder="Skriv svaret her …"></textarea>
     <div class="btns"><button onclick="saveQ()">Lagre svaret</button><button class="secondary" onclick="speak(TEXT+' '+PLAN[planIdx].q,PLAN[planIdx])">🔊 Les opp</button></div></section>`;
    const tid=ensureTrial(s); document.getElementById('ans').addEventListener('input',()=>{ if(!started.has(tid)){started.add(tid);EdelsData.responseStarted(sessionId,tid);} },{once:true});
  }
}
function saveQ(){ const s=PLAN[planIdx], v=document.getElementById('ans').value;
  if(!v.trim()){alert('Skriv et svar først. Du kan skrive «jeg vet ikke».');return}
  EdelsData.saveFirstResponse(sessionId,ensureTrial(s),v,{source:'naturfag_uke45_ui',latencyMs:Date.now()-shownAt});
  answers[s.id]={text:v}; planIdx++; render(); window.scrollTo(0,0); }
function renderEnd(){ EdelsData.finishAndSubmit(sessionId);
  host.innerHTML=`<section class="card"><div class="ok">Bra jobbet, Edel! 🌸 Du har svart på alle tre spørsmålene.</div><div id="sendStatus" class="small" style="margin-top:.6rem"></div></section>`;
  const el=document.getElementById('sendStatus'); el.textContent='Sender til mamma …';
  const sentOK=()=>{ try{ const x=EdelsData.getSession(sessionId); return !!(x&&x.submission&&x.submission.status==='sent'); }catch(e){ return false; } };
  const manual=async()=>{ el.textContent='Sender …';
    try{ await post(TITLE+' – fullført økt',{status:'fullført'}); el.textContent='✓ Sendt til mamma'; }
    catch(e){ el.innerHTML='Det ble ikke sendt. <button class="sendbtn" id="retryBtn">📤 Send til mamma</button>'; document.getElementById('retryBtn').onclick=manual; } };
  setTimeout(()=>{ if(sentOK()) el.textContent='✓ Sendt til mamma'; else manual(); },4000); setProgress(); }
render();
</script></body></html>
